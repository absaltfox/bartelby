# fly.toml — Bartelby app configuration for Fly.io

app = 'bartelby'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = "production"
  DATABASE_DRIVER = "turso"
  STORAGE_DRIVER = "s3"
  S3_REGION = "auto"
  S3_FORCE_PATH_STYLE = "false"
  FLY_MACHINES_ENABLED = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
