app = "bartelby"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_DRIVER = "turso"
  STORAGE_DRIVER = "s3"
  S3_REGION = "ca-east-006"
  S3_FORCE_PATH_STYLE = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
