# Single-machine setup for local use and evaluation. It is not a hardened
# production deployment: sessions are held in process memory and uploads sit on
# a local volume. See DEPLOY.md for a production topology.
services:
  app:
    # Default local Docker topology: a single process that serves HTTP and runs
    # background work. For a split web/worker shape, run the same image twice
    # and set DISABLE_BACKGROUND_WORKER=1 on the web-facing service only.
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-}
      # Database — 'better-sqlite3' for a local SQLite file (durable per
      # statement, full-text entity search), 'turso' for Turso. 'sqljs' also
      # works but rewrites the whole file on each save and has no FTS5.
      DATABASE_DRIVER: ${DATABASE_DRIVER:-better-sqlite3}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      # Storage — 'local' for the uploads volume below, 's3' for an external
      # S3-compatible bucket (no object store is bundled; set the S3_* values).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Single-node Docker is a deliberate local exception to the production
      # fail-closed defaults for local storage and in-memory sessions.
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: ${ALLOW_LOCAL_STORAGE_IN_PRODUCTION:-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      # Session store — use 'redis' for Redis, 'memory' for in-process
      SESSION_STORE: ${SESSION_STORE:-memory}
      ALLOW_MEMORY_SESSION_STORE_IN_PRODUCTION: ${ALLOW_MEMORY_SESSION_STORE_IN_PRODUCTION:-1}
      REDIS_URL: ${REDIS_URL:-}
      # LLM providers
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-}
      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      # Nothing sits in front of the app here, so forwarded headers are not
      # trusted, and it is served over plain http: without this override the
      # session cookie is marked Secure and sign-in cannot stick. Putting this
      # behind a TLS proxy? Set PUBLIC_APP_URL to the https URL, TRUST_PROXY=1
      # and ALLOW_INSECURE_HTTP_IN_PRODUCTION=0.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      ALLOW_INSECURE_HTTP_IN_PRODUCTION: ${ALLOW_INSECURE_HTTP_IN_PRODUCTION:-1}
    volumes:
      # The SQLite database file (better-sqlite3 or sqljs); unused with turso
      - app-data:/app/data
      # Only needed for STORAGE_DRIVER=local
      - app-uploads:/app/data/uploads
      - app-temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)throw r.status}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  app-data:
  app-uploads:
  app-temp:
